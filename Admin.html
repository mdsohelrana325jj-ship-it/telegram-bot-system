<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Telegram Admin Panel</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f3f8;
  color:#171923;
}

body.dark{
  background:#08090c;
  color:#f4f4f5;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =====================================================
   APP
===================================================== */

#app{
  width:100%;
  min-height:100vh;
}

.page{
  width:100%;
  min-height:100vh;
  padding:18px;
}

.page-inner{
  width:100%;
  max-width:720px;
  margin:0 auto;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
}

.brand{
  font-size:22px;
  font-weight:800;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:44px;
  height:44px;
  border:none;
  border-radius:14px;
  background:#fff;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  font-size:20px;
}

body.dark .icon-btn{
  background:#17191f;
  color:#fff;
}

/* =====================================================
   CARD
===================================================== */

.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.07);
}

body.dark .card{
  background:#15171c;
  box-shadow:none;
}

.card-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:14px;
}

/* =====================================================
   MAIN MENU BUTTON
===================================================== */

.menu-btn{
  width:100%;
  min-height:62px;
  border:1px solid #e1e4eb;
  background:#fff;
  border-radius:18px;
  margin-bottom:12px;
  padding:14px 16px;
  text-align:left;
  font-weight:800;
  font-size:17px;
  color:#171923;
  transition:.15s;
}

.menu-btn:active{
  transform:scale(.98);
}

body.dark .menu-btn{
  background:#111318;
  border-color:#292d36;
  color:#fff;
}

/* =====================================================
   BACK BUTTON
===================================================== */

.back-btn{
  width:100%;
  min-height:58px;
  border:none;
  border-radius:17px;
  background:#e9ecf2;
  color:#20232c;
  font-weight:800;
  font-size:18px;
  margin-bottom:16px;
}

body.dark .back-btn{
  background:#20232b;
  color:#fff;
}

/* =====================================================
   INPUTS
===================================================== */

label{
  display:block;
  font-size:14px;
  font-weight:800;
  margin-bottom:7px;
}

.field{
  margin-bottom:16px;
}

input[type="text"],
input[type="url"],
input[type="password"],
input[type="number"],
textarea,
select{
  width:100%;
  border:1px solid #dfe2e8;
  border-radius:15px;
  background:#fafbfc;
  padding:13px 14px;
  outline:none;
  color:#171923;
}

textarea{
  min-height:110px;
  resize:vertical;
}

body.dark input,
body.dark textarea,
body.dark select{
  background:#0e1014;
  border-color:#30343d;
  color:#fff;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#6d5dfc;
}

/* =====================================================
   SWITCH
===================================================== */

.switch-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
}

.switch{
  position:relative;
  width:54px;
  height:30px;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#c8ccd4;
  border-radius:30px;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  left:3px;
  top:3px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.switch input:checked + .slider{
  background:#6d5dfc;
}

.switch input:checked + .slider:before{
  transform:translateX(24px);
}

/* =====================================================
   SAVE
===================================================== */

.save-btn{
  width:100%;
  min-height:56px;
  border:none;
  border-radius:17px;
  background:#6d5dfc;
  color:#fff;
  font-size:17px;
  font-weight:900;
  margin-top:8px;
}

.save-btn:active{
  transform:scale(.98);
}

/* =====================================================
   ADD SLOT
===================================================== */

.add-slot{
  width:100%;
  min-height:54px;
  border:2px dashed #8b82ff;
  background:#f3f1ff;
  color:#5546dc;
  border-radius:16px;
  font-weight:900;
  margin:12px 0;
}

body.dark .add-slot{
  background:#19162d;
}

/* =====================================================
   SLOT
===================================================== */

.slot{
  border:1px solid #dfe2e8;
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
  background:#fafbfc;
}

body.dark .slot{
  background:#101217;
  border-color:#2c3038;
}

.slot-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.slot-title{
  font-weight:900;
  font-size:17px;
}

.remove-slot{
  border:none;
  background:#ffe5e3;
  color:#c72e23;
  border-radius:12px;
  padding:8px 12px;
  font-weight:800;
}

/* =====================================================
   UPLOAD
===================================================== */

.upload-box{
  border:2px dashed #c7cad2;
  border-radius:17px;
  padding:14px;
  margin-top:8px;
}

.upload-box input{
  width:100%;
}

/* =====================================================
   PREVIEW
===================================================== */

.preview{
  margin-top:16px;
  border-radius:20px;
  background:#eef0f5;
  padding:15px;
}

body.dark .preview{
  background:#0d0f13;
}

.preview-title{
  font-size:16px;
  font-weight:900;
  margin-bottom:12px;
}

.preview-media{
  width:100%;
  aspect-ratio:2 / 1;
  border-radius:16px;
  overflow:hidden;
  background:#252836;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  margin-bottom:10px;
}

.preview-media img,
.preview-media video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview-text{
  background:#fff;
  border-radius:14px;
  padding:13px;
  margin-bottom:10px;
  white-space:pre-wrap;
}

body.dark .preview-text{
  background:#181b21;
}

.fake-telegram-btn{
  width:100%;
  min-height:46px;
  border-radius:13px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  margin-top:8px;
  background:#6d5dfc;
}

/* =====================================================
   LOGIN
===================================================== */

#loginPage{
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:25px;
  border-radius:24px;
  box-shadow:0 10px 40px rgba(0,0,0,.1);
}

body.dark .login-box{
  background:#15171c;
}

.login-title{
  font-size:25px;
  font-weight:900;
  margin-bottom:18px;
}

/* =====================================================
   TOAST
===================================================== */

#toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#15171c;
  color:#fff;
  padding:12px 18px;
  border-radius:13px;
  display:none;
  z-index:9999;
  max-width:90%;
  text-align:center;
}

</style>
</head>

<body>

<div id="toast"></div>

<script>

/* =====================================================
   STATE
===================================================== */

let token =
  localStorage.getItem("admin_token") || "";

let settings = null;

let currentButtonId = null;

let currentLanguage =
  localStorage.getItem("admin_language") || "bn";

/* =====================================================
   ELEMENTS
===================================================== */

const $ = id =>
  document.getElementById(id);

/* =====================================================
   TOAST
===================================================== */

function toast(message){

  const el = $("toast");

  el.innerText = message;

  el.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(() => {
      el.style.display = "none";
    }, 2200);
}

/* =====================================================
   API
===================================================== */

async function api(url, options = {}){

  options.headers = {
    ...(options.headers || {}),
    Authorization:
      token ? `Bearer ${token}` : ""
  };

  const response =
    await fetch(url, options);

  if (response.status === 401){

    localStorage.removeItem("admin_token");

    token = "";

    showOnly("loginPage");

    throw new Error("Session expired");
  }

  return response.json();
}

/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const password =
    $("loginPassword").value.trim();

  if (!password){
    toast("Enter password");
    return;
  }

  const result =
    await fetch("/api/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        password
      })
    });

  const data =
    await result.json();

  if (!data.ok){

    toast(data.error || "Login failed");

    return;
  }

  token = data.token;

  localStorage.setItem(
    "admin_token",
    token
  );

  await loadSettings();

  showOnly("mainPage");
}

/* =====================================================
   LOAD
===================================================== */

async function loadSettings(){

  const data =
    await api("/api/settings");

  if (!data.ok){
    throw new Error(
      data.error || "Unable to load settings"
    );
  }

  settings = data.settings || {};
  
  // Safe defaults if welcome or mainButtons are missing
  if (!settings.welcome) {
    settings.welcome = {};
  }
  if (!settings.mainButtons) {
    settings.mainButtons = [];
  }
}

/* =====================================================
   PAGE SWITCHING
===================================================== */

function showOnly(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.add("hidden");

    });

  const page =
    $(pageId);

  if (page){
    page.classList.remove("hidden");

    window.scrollTo({
      top:0,
      behavior:"instant"
    });
  }
}

function goMain(){

  showOnly("mainPage");
}

function openWelcomePage(){

  if (!settings) {
    settings = { welcome: {}, mainButtons: [] };
  }
  renderWelcome();

  showOnly("welcomePage");
}

function openMainButtonsPage(){

  if (!settings) {
    settings = { welcome: {}, mainButtons: [] };
  }
  renderMainButtons();

  showOnly("mainButtonsPage");
}

function openAudioPage(){

  if (!settings) {
    settings = { welcome: {}, mainButtons: [] };
  }
  renderAudio();

  showOnly("audioPage");
}

function openSystemSettingsPage(){

  if (!settings) {
    settings = { welcome: {}, mainButtons: [] };
  }
  renderSystemSettings();

  showOnly("systemSettingsPage");
}

function openAllViewPage(){

  if (!settings) {
    settings = { welcome: {}, mainButtons: [] };
  }

  showOnly("allViewPage");
}

/* =====================================================
   WELCOME
===================================================== */

function renderWelcome(){

  const w =
    settings.welcome || {};

  $("profilePhoto").checked =
    !!w.profilePhoto;

  $("welcomeMediaType").value =
    w.mediaType || "none";

  $("welcomeMediaSource").value =
    w.mediaSource || "upload";

  $("welcomeMediaUrl").value =
    w.mediaUrl || "";

  $("welcomeText").value =
    w.text || "";

  renderWelcomeView();
}

async function saveWelcome(){

  if (!settings.welcome) {
    settings.welcome = {};
  }

  settings.welcome.profilePhoto =
    $("profilePhoto").checked;

  settings.welcome.mediaType =
    $("welcomeMediaType").value;

  settings.welcome.mediaSource =
    $("welcomeMediaSource").value;

  settings.welcome.mediaUrl =
    $("welcomeMediaUrl").value.trim();

  settings.welcome.text =
    $("welcomeText").value;

  const file =
    $("welcomeFile").files[0];

  if (
    file &&
    settings.welcome.mediaSource === "upload"
  ){

    const mediaId =
      await uploadFile(
        file,
        settings.welcome.mediaType
      );

    if (!mediaId) return;

    settings.welcome.mediaId =
      mediaId;
  }

  await saveSettings();

  renderWelcomeView();

  toast("Welcome Settings Saved");
}

function renderWelcomeView(){

  const w = settings.welcome || {};
  const view = $("welcomeView");
  if (!view) return;

  let html = `
    <div class="preview-title">
      👁️ SYSTEM VIEW
    </div>
  `;

  if (w.mediaId || w.mediaUrl){
    html += mediaPreview(
      w.mediaType || "none",
      w.mediaSource || "upload",
      w.mediaId,
      w.mediaUrl
    );
  }

  if (w.text){
    html += `
      <div class="preview-text">
        ${escapeHtml(w.text)}
      </div>
    `;
  }

  view.innerHTML = html;
}

/* =====================================================
   MAIN BUTTON LIST
===================================================== */

function renderMainButtons(){

  const box =
    $("mainButtonsList");

  box.innerHTML = "";

  (settings.mainButtons || []).forEach(button => {

    const el =
      document.createElement("button");

    el.className =
      "menu-btn";

    el.innerHTML =
      `${button.enabled ? "🟢" : "🔴"} ${escapeHtml(button.text)}`;

    el.onclick = () => {

      currentButtonId =
        button.id;

      openMainEditor(button.id);

    };

    box.appendChild(el);

  });
}

/* =====================================================
   MAIN BUTTON EDITOR
===================================================== */

function openMainEditor(id){

  currentButtonId = id;

  const button =
    (settings.mainButtons || []).find(
      b => b.id === id
    );

  if (!button) return;

  $("mainEditorTitle").innerText =
    button.text || "Main Button";

  $("mainEnabled").checked =
    !!button.enabled;

  $("mainButtonText").value =
    button.text || "";

  $("mainButtonColor").value =
    button.buttonColor || "#6d5dfc";

  $("mainButtonImage").value =
    button.buttonImageUrl || "";

  $("headerMediaType").value =
    button.headerMediaType || "none";

  $("headerMediaSource").value =
    button.headerMediaSource || "upload";

  $("headerMediaUrl").value =
    button.headerMediaUrl || "";

  $("headerText").value =
    button.headerText || "";

  renderSlots(button);

  renderMainSystemView();

  showOnly("mainEditorPage");

  container.innerHTML = "";

  (button.slots || []).forEach(
    (slot,index) => {

      container.appendChild(
        createSlotElement(slot,index)

    }
  );
}

function addSlot(){

  const button =
    getCurrentButton();

  if (!button) return;

  if (!button.slots) {
    button.slots = [];
  }

  if (button.slots.length >= 20){

    toast("Maximum 20 slots");

    return;
  }

  button.slots.push({
    enabled:true,

    mediaType:"none",
    mediaSource:"upload",
    mediaId:null,
    mediaUrl:"",

    text:"",

    button1:{
      enabled:true,
      text:"OPEN LINK",
      url:"",
      color:"#6d5dfc",
      imageUrl:""
    },

    button2:{
      enabled:false,
      text:"SUPPORT",
      url:"",
      color:"#6d5dfc",
      imageUrl:""
    }
  });

  renderSlots(button);

  renderMainSystemView();
}

/* =====================================================
   READ SLOTS
===================================================== */

function updateSlotsFromDOM(){

  const button =
    getCurrentButton();

  if (!button) return;

  const slotElements =
    [...document.querySelectorAll(".slot")];

  slotElements.forEach(
    (el,index) => {

      const slot =
        button.slots[index];

      if (!slot) return;

      slot.enabled =
        el.querySelector(".slot-enabled").checked;

      slot.mediaType =
        el.querySelector(".slot-media-type").value;

      slot.mediaSource =
        el.querySelector(".slot-media-source").value;

      slot.mediaUrl =
        el.querySelector(".slot-url").value.trim();

      slot.text =
        el.querySelector(".slot-text").value;

      if (!slot.button1) slot.button1 = {};
      slot.button1.enabled =
        el.querySelector(".b1-enabled").checked;

      slot.button1.text =
        el.querySelector(".b1-text").value;

      slot.button1.url =
        el.querySelector(".b1-url").value.trim();

      slot.button1.color =
        el.querySelector(".b1-color").value;

      if (!slot.button2) slot.button2 = {};
      slot.button2.enabled =
        el.querySelector(".b2-enabled").checked;

      slot.button2.text =
        el.querySelector(".b2-text").value;

      slot.button2.url =
        el.querySelector(".b2-url").value.trim();

      slot.button2.color =
        el.querySelector(".b2-color").value;

    }
  );
}

/* =====================================================
   SAVE MAIN BUTTON
===================================================== */

async function saveMainButton(){

  const button =
    getCurrentButton();

  if (!button) return;

  button.enabled =
    $("mainEnabled").checked;

  button.text =
    $("mainButtonText").value.trim();

  button.buttonColor =
    $("mainButtonColor").value;

  button.buttonImageUrl =
    $("mainButtonImage").value.trim();

  button.headerMediaType =
    $("headerMediaType").value;

  button.headerMediaSource =
    $("headerMediaSource").value;

  button.headerMediaUrl =
    $("headerMediaUrl").value.trim();

  button.headerText =
    $("headerText").value;

  updateSlotsFromDOM();

  const file =
    $("headerFile").files[0];

  if (
    file &&
    button.headerMediaSource === "upload"
  ){

    const mediaId =
      await uploadFile(
        file,
        button.headerMediaType
      );

    if (!mediaId) return;

    button.headerMediaId =
      mediaId;
  }

  const slotElements =
    [...document.querySelectorAll(".slot")];

  for (
    let i = 0;
    i < slotElements.length;
    i++
  ){

    const file =
      slotElements[i]
        .querySelector(".slot-file")
        .files[0];

    if (
      file &&
      button.slots[i] &&
      button.slots[i].mediaSource === "upload"
    ){

      const mediaType =
        button.slots[i].mediaType;

      const mediaId =
        await uploadFile(
          file,
          mediaType
        );

      if (!mediaId) return;

      button.slots[i].mediaId =
        mediaId;
    }
  }

  await saveSettings();

  renderMainSystemView();

  toast("Main Button Saved");
}

  return settings.mainButtons.find(
    b => b.id === currentButtonId
  );
}

/* =====================================================
   UPLOAD
===================================================== */

async function uploadFile(file,kind){

  if (!file){
    return null;
  }

  if (file.size > 50 * 1024 * 1024){

    toast("Maximum file size is 50MB");

    return null;
  }

  let mediaKind = kind;

  if (
    mediaKind !== "photo" &&
    mediaKind !== "video" &&
    mediaKind !== "audio"
  ){

    if (
      file.type.startsWith("image/")
    ){
      mediaKind = "photo";
    }

    else if (
      file.type.startsWith("video/")
    ){
      mediaKind = "video";
    }

    else if (
      file.type.startsWith("audio/")
    ){
      mediaKind = "audio";
    }
  }

  const form =
    new FormData();

  form.append(
    "kind",
    mediaKind
  );

  form.append(
    "file",
    file
  );

  toast("Uploading...");

  const response =
    await fetch(
      "/api/upload",
      {
        method:"POST",
        headers:{
          Authorization:
            `Bearer ${token}`
        },
        body:form
      }
    );

  const data =
    await response.json();

  if (!data.ok){

    toast(
      data.error ||
      "Upload failed"
    );

    return null;
  }

  toast("Upload complete");

  return data.mediaId;
}

/* =====================================================
   SAVE ALL SETTINGS
===================================================== */

async function saveSettings(){

  const response =
    await api(
      "/api/settings",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify(settings)
      }
    );

  if (!response.ok){

    toast(
      response.error ||
      "Save failed"
    );

    return false;
  }

  settings =
    response.settings || settings;

  return true;
}

/* =====================================================
   MEDIA PREVIEW
===================================================== */

function mediaPreview(
  type,
  source,
  id,
  url
){

  let src = "";

  if (
    source === "upload" &&
    id
  ){

    src =
      `/media/${id}`;

  } else {

    src =
      url || "";

  }

  if (!src){

    return `
      <div class="preview-media">
        No Media
      </div>
    `;

  }

  if (type === "photo"){

    return `
      <div class="preview-media">
        <img src="${escapeAttr(src)}">
      </div>
    `;

  }

  if (type === "video"){

    return `
      <div class="preview-media">
        <video
          src="${escapeAttr(src)}"
          controls
        ></video>
      </div>
    `;

  }

  if (type === "audio"){

    return `
      <div style="margin-bottom:10px;">
        <audio
          src="${escapeAttr(src)}"
          controls
          style="width:100%;"
        ></audio>
      </div>
    `;

  }

  return "";
}

  a.button1.enabled =
    $("audioB1Enabled").checked;

  a.button1.text =
    $("audioB1Text").value;

  a.button1.url =
    $("audioB1Url").value.trim();

    $("audioB2Enabled").checked;

    $("audioB2Text").value;

===================================================== */

async function resetAll(){

  const ok =
    confirm(
      "Are you sure you want to reset everything?"
    );

  if (!ok) return;

  const result =
    await api(
      "/api/reset",
      {
        method:"POST"
      }
    );

  if (!result.ok){

    toast(
      result.error ||
      "Reset failed"
    );

    return;
  }

  settings =
    result.settings || {};

  toast("All systems reset");

  showOnly("mainPage");
}

/* =====================================================
   THEME
===================================================== */

function toggleTheme(){

  document.body
    .classList
    .toggle("dark");

  localStorage.setItem(
    "admin_theme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );
}

/* =====================================================
   LANGUAGE
===================================================== */

function toggleLanguage(){

  currentLanguage =
    currentLanguage === "bn"
      ? "en"
      : "bn";

  localStorage.setItem(
    "admin_language",
    currentLanguage
  );

  const langBtn = $("languageBtn");
  if (langBtn) {
    langBtn.innerText =
      currentLanguage === "bn"
        ? "🇧🇩"
        : "🇺🇸";
  }

  toast(
    currentLanguage === "bn"
      ? "বাংলা মোড সক্রিয় করা হয়েছে"
      : "English Mode Activated"
  );
}

/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(value){

  return escapeHtml(value);
}

/* =====================================================
   AUTO REFRESH PREVIEW
===================================================== */

[
  "mainEnabled",
  "mainButtonText",
  "mainButtonColor",
  "mainButtonImage",
  "headerMediaType",
  "headerMediaSource",
  "headerMediaUrl",
  "headerText"
].forEach(id => {

  const el =
    $(id);

  if (!el) return;

  el.addEventListener(
    "input",
    renderMainSystemView
  );

  el.addEventListener(
    "change",
    renderMainSystemView
  );

});

/* =====================================================
   STARTUP
===================================================== */

(function(){

  const theme =
    localStorage.getItem(
      "admin_theme"
    );

  if (theme === "dark"){
    document.body.classList.add("dark");
  }

  const langBtn = $("languageBtn");
  if (langBtn){
    langBtn.innerText =
      currentLanguage === "bn"
        ? "🇧🇩"
        : "🇺🇸";
  }

})();

async function boot(){

  if (!token){

    showOnly("loginPage");

    return;
  }

  try{

    await loadSettings();

    showOnly("mainPage");

  }catch(error){

    localStorage.removeItem(
      "admin_token"
    );

    token = "";

    showOnly("loginPage");

  }

}

boot();

</script>
