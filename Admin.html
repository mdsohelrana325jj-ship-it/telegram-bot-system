<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Telegram Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f3f8;
  color:#171923;
}

body.dark{
  background:#08090c;
  color:#f4f4f5;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.page{
  width:100%;
  min-height:100vh;
  padding:18px;
}

.page-inner{
  width:100%;
  max-width:720px;
  margin:auto;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  min-width:44px;
  height:44px;
  border:0;
  border-radius:14px;
  background:#fff;
  box-shadow:0 4px 18px #0001;
  font-size:16px;
  font-weight:800;
}

.dark .icon-btn{
  background:#17191f;
  color:#fff;
}

.card,
.login-box{
  background:#fff;
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 25px #00000012;
}

.dark .card,
.dark .login-box{
  background:#15171c;
  box-shadow:none;
}

.card-title{
  font-size:19px;
  font-weight:900;
  margin-bottom:14px;
}

.menu-btn{
  width:100%;
  min-height:62px;
  border:1px solid #e1e4eb;
  background:#fff;
  border-radius:18px;
  margin-bottom:12px;
  padding:14px 16px;
  text-align:left;
  font-weight:900;
  font-size:16px;
  color:#171923;
  transition:.15s;
}

.menu-btn:active{
  transform:scale(.98);
}

.dark .menu-btn{
  background:#111318;
  border-color:#292d36;
  color:#fff;
}

.back-btn{
  width:100%;
  min-height:58px;
  border:0;
  border-radius:17px;
  background:#e9ecf2;
  color:#20232c;
  font-weight:900;
  font-size:18px;
  margin-bottom:16px;
}

.dark .back-btn{
  background:#20232b;
  color:#fff;
}

label{
  display:block;
  font-size:14px;
  font-weight:800;
  margin-bottom:7px;
}

.field{
  margin-bottom:16px;
}

input[type=text],
input[type=url],
input[type=password],
input[type=number],
textarea,
select{
  width:100%;
  border:1px solid #dfe2e8;
  border-radius:15px;
  background:#fafbfc;
  padding:13px 14px;
  outline:0;
  color:#171923;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.dark input,
.dark textarea,
.dark select{
  background:#0e1014;
  border-color:#30343d;
  color:#fff;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#6d5dfc;
}

.switch-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
}

.switch{
  position:relative;
  width:54px;
  height:30px;
  margin:0;
  flex-shrink:0;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#c8ccd4;
  border-radius:30px;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  left:3px;
  top:3px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.switch input:checked+.slider{
  background:#6d5dfc;
}

.switch input:checked+.slider:before{
  transform:translateX(24px);
}

.save-btn{
  width:100%;
  min-height:56px;
  border:0;
  border-radius:17px;
  background:#6d5dfc;
  color:#fff;
  font-size:17px;
  font-weight:900;
  margin-top:8px;
}

.add-slot{
  width:100%;
  min-height:54px;
  border:2px dashed #8b82ff;
  background:#f3f1ff;
  color:#5546dc;
  border-radius:16px;
  font-weight:900;
  margin:12px 0;
}

.dark .add-slot{
  background:#19162d;
}

.slot{
  border:1px solid #dfe2e8;
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
  background:#fafbfc;
}

.dark .slot{
  background:#101217;
  border-color:#2c3038;
}

.slot-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.slot-title{
  font-weight:900;
  font-size:17px;
}

.remove-slot{
  border:0;
  background:#ffe5e3;
  color:#c72e23;
  border-radius:12px;
  padding:8px 12px;
  font-weight:800;
}

.dark .remove-slot{
  background:#301714;
  color:#ff8d85;
}

.upload-box{
  border:2px dashed #c7cad2;
  border-radius:17px;
  padding:14px;
  margin-top:8px;
  margin-bottom:16px;
}

.upload-box input{
  width:100%;
}

.preview{
  margin-top:16px;
  border-radius:20px;
  background:#eef0f5;
  padding:15px;
}

.dark .preview{
  background:#0d0f13;
}

.preview-title{
  font-size:16px;
  font-weight:900;
  margin-bottom:12px;
}

.preview-media{
  width:100%;
  aspect-ratio:2/1;
  border-radius:16px;
  overflow:hidden;
  background:#252836;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  margin-bottom:10px;
}

.preview-media img,
.preview-media video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview-media audio{
  width:90%;
}

.preview-text{
  background:#fff;
  border-radius:14px;
  padding:13px;
  margin-bottom:10px;
  white-space:pre-wrap;
  word-break:break-word;
}

.dark .preview-text{
  background:#181b21;
}

.fake-telegram-btn{
  width:100%;
  min-height:48px;
  border-radius:13px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  margin-top:8px;
  background:#6d5dfc;
  background-size:cover;
  background-position:center;
  text-align:center;
  padding:8px 12px;
}

.preview-separator{
  height:1px;
  background:#d6d9df;
  margin:18px 0;
}

.dark .preview-separator{
  background:#30343d;
}

.small{
  font-size:12px;
  color:#7f879d;
  line-height:1.45;
}

.dark .small{
  color:#9aa1b2;
}

.login-box{
  width:100%;
  max-width:430px;
  margin:10vh auto;
}

.login-title{
  font-size:25px;
  font-weight:900;
  margin-bottom:18px;
}

#toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#15171c;
  color:#fff;
  padding:12px 18px;
  border-radius:13px;
  display:none;
  z-index:9999;
  max-width:90%;
  text-align:center;
}

.hr{
  height:1px;
  background:#ddd;
  margin:18px 0;
}

.dark .hr{
  background:#30343d;
}

.danger{
  color:#d83228!important;
  background:#fff0ee!important;
}

.dark .danger{
  background:#301714!important;
}

.status{
  padding:10px 12px;
  border-radius:12px;
  background:#eef0f5;
  margin-bottom:12px;
  font-size:13px;
}

.dark .status{
  background:#101217;
}

.media-note{
  font-size:12px;
  color:#777;
  margin-top:6px;
}

.color-preview{
  width:100%;
  height:50px;
  border-radius:13px;
  border:1px solid #ddd;
  margin-top:8px;
}

.dark .color-preview{
  border-color:#444;
}

@media(max-width:520px){
  .page{
    padding:12px;
  }

  .card{
    padding:14px;
  }

  .brand{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div id="toast"></div>

<!-- LOGIN -->
<section id="loginPage" class="page">
  <div class="login-box">

    <div class="login-title" data-i18n="adminPanel">
      🔐 Admin Panel
    </div>

    <div class="field">
      <label data-i18n="adminPassword">Admin Password</label>
      <input
        id="loginPassword"
        type="password"
        data-ph="enterPassword"
      >
    </div>

    <button
      class="save-btn"
      onclick="login()"
      data-i18n="login"
    >
      LOGIN
    </button>

  </div>
</section>


<!-- MAIN -->
<section id="mainPage" class="page hidden">
  <div class="page-inner">

    <div class="topbar">

      <div
        class="brand"
        data-i18n="adminTitle"
      >
        ⚙️ ADMIN PANEL
      </div>

      <div class="top-actions">

        <button
          class="icon-btn"
          onclick="toggleTheme()"
          title="Theme"
        >
          🌞
        </button>

        <button
          class="icon-btn"
          onclick="toggleLanguage()"
          id="languageBtn"
        >
          🇧🇩 English
        </button>

      </div>
    </div>


    <div class="card">

      <button
        class="menu-btn"
        onclick="openWelcomePage()"
        data-i18n="welcomeSettings"
      >
        👋 Welcome Settings
      </button>

      <button
        class="menu-btn"
        onclick="openMainButtonsPage()"
        data-i18n="mainButtons"
      >
        🏠 Main Buttons
      </button>

      <button
        class="menu-btn"
        onclick="openAudioPage()"
        data-i18n="audioSystem"
      >
        🎧 Audio System
      </button>

      <button
        class="menu-btn"
        onclick="openSystemSettingsPage()"
        data-i18n="systemSettings"
      >
        ⚙️ System Settings
      </button>

      <button
        class="menu-btn"
        onclick="openAllViewPage()"
        data-i18n="allSystemView"
      >
        👁️ ALL SYSTEM VIEW
      </button>

      <button
        class="menu-btn danger"
        onclick="resetAll()"
        data-i18n="resetAll"
      >
        ALL WELCOME SYSTEM RESET
      </button>

    </div>

  </div>
</section>


<!-- WELCOME -->
<section id="welcomePage" class="page hidden">
  <div class="page-inner">

    <button
      class="back-btn"
      onclick="goMain()"
      data-i18n="back"
    >
      ← BACK
    </button>

    <div class="card">

      <div
        class="card-title"
        data-i18n="welcomeSettings"
      >
        👋 Welcome Settings
      </div>


      <div class="switch-row">
        <span data-i18n="profilePhoto">
          Profile Photo
        </span>

        <label class="switch">
          <input
            id="profilePhoto"
            type="checkbox"
          >
          <span class="slider"></span>
        </label>
      </div>


      <div class="field">
        <label data-i18n="welcomeMediaType">
          Welcome Media Type
        </label>

        <select id="welcomeMediaType">

          <option
            value="none"
            data-i18n="none"
          >
            None
          </option>

          <option
            value="photo"
            data-i18n="image"
          >
            Image
          </option>

          <option
            value="video"
            data-i18n="video"
          >
            Video
          </option>

          <option
            value="audio"
            data-i18n="audio"
          >
            Audio
          </option>

        </select>
      </div>


      <div class="field">
        <label data-i18n="mediaSource">
          Media Source
        </label>

        <select id="welcomeMediaSource">

          <option
            value="upload"
            data-i18n="upload"
          >
            Upload
          </option>

          <option
            value="url"
            data-i18n="urlLink"
          >
            URL Link
          </option>

        </select>
      </div>


      <div class="upload-box">

        <label data-i18n="uploadMedia">
          Upload Media
        </label>

        <input
          id="welcomeFile"
          type="file"
          accept="image/*,video/*,audio/*"
        >

        <div
          class="media-note"
          data-i18n="max50"
        >
          Maximum 50 MB
        </div>

      </div>


      <div class="field">

        <label data-i18n="mediaUrl">
          Media URL
        </label>

        <input
          id="welcomeMediaUrl"
          type="url"
          data-ph="mediaUrlPlaceholder"
        >

      </div>


      <div class="field">

        <label data-i18n="welcomeText">
          Welcome Text
        </label>

        <textarea
          id="welcomeText"
          data-ph="welcomeTextPlaceholder"
        ></textarea>

      </div>


      <button
        class="save-btn"
        onclick="saveWelcome()"
        data-i18n="save"
      >
        💾 SAVE
      </button>


      <div
        id="welcomeView"
        class="preview"
      ></div>

    </div>

  </div>
</section>


<!-- MAIN BUTTON LIST -->
<section id="mainButtonsPage" class="page hidden">

  <div class="page-inner">

    <button
      class="back-btn"
      onclick="goMain()"
      data-i18n="back"
    >
      ← BACK
    </button>

    <div class="card">

      <div
        class="card-title"
        data-i18n="mainButtons"
      >
        🏠 Main Buttons
      </div>

      <div id="mainButtonsList"></div>

    </div>

  </div>

</section>


<!-- MAIN BUTTON EDITOR -->
<section id="mainEditorPage" class="page hidden">

  <div class="page-inner">

    <button
      class="back-btn"
      onclick="openMainButtonsPage()"
      data-i18n="back"
    >
      ← BACK
    </button>


    <div class="card">

      <div
        id="mainEditorTitle"
        class="card-title"
      ></div>


      <div class="switch-row">

        <span data-i18n="onOff">
          ON / OFF
        </span>

        <label class="switch">
          <input
            id="mainEnabled"
            type="checkbox"
          >
          <span class="slider"></span>
        </label>

      </div>


      <div class="field">

        <label data-i18n="mainButtonName">
          Main Button Name
        </label>

        <input
          id="mainButtonText"
          type="text"
        >

      </div>


      <div class="field">

        <label data-i18n="buttonColor">
          Button Color
        </label>

        <input
          id="mainButtonColor"
          type="color"
          value="#6d5dfc"
          style="width:100%;height:52px"
        >

        <div
          id="buttonColorPreview"
          class="color-preview"
        ></div>

      </div>


      <div class="field">

        <label data-i18n="buttonBgImage">
          Button Background Image URL
        </label>

        <input
          id="mainButtonImage"
          type="url"
          data-ph="buttonImagePlaceholder"
        >

      </div>


      <div class="hr"></div>


      <div
        class="card-title"
        data-i18n="headerMedia"
      >
        Header Media
      </div>


      <div class="field">

        <label data-i18n="mediaType">
          Header Media Type
        </label>

        <select id="headerMediaType">

          <option
            value="none"
            data-i18n="none"
          >
            None
          </option>

          <option
            value="photo"
            data-i18n="image"
          >
            Image
          </option>

          <option
            value="video"
            data-i18n="video"
          >
            Video
          </option>

          <option
            value="audio"
            data-i18n="audio"
          >
            Audio
          </option>

        </select>

      </div>


      <div class="field">

        <label data-i18n="source">
          Source
        </label>

        <select id="headerMediaSource">

          <option
            value="upload"
            data-i18n="upload"
          >
            Upload
          </option>

          <option
            value="url"
            data-i18n="urlLink"
          >
            URL Link
          </option>

        </select>

      </div>


      <div class="upload-box">

        <label data-i18n="headerUpload">
          Header Upload
        </label>

        <input
          id="headerFile"
          type="file"
          accept="image/*,video/*,audio/*"
        >

        <div
          class="media-note"
          data-i18n="max50"
        >
          Maximum 50 MB
        </div>

      </div>


      <div class="field">

        <label data-i18n="headerUrl">
          Header URL
        </label>

        <input
          id="headerMediaUrl"
          type="url"
          data-ph="mediaUrlPlaceholder"
        >

      </div>


      <div class="field">

        <label data-i18n="headerText">
          Header Text
        </label>

        <textarea id="headerText"></textarea>

      </div>


      <div class="hr"></div>


      <div
        class="card-title"
        data-i18n="slots"
      >
        Slots
      </div>


      <div id="slotsContainer"></div>


      <button
        class="add-slot"
        onclick="addSlot()"
        data-i18n="addSlot"
      >
        + ADD SLOT
      </button>


      <button
        class="save-btn"
        onclick="saveMainButton()"
        data-i18n="save"
      >
        💾 SAVE
      </button>


      <div
        id="mainSystemView"
        class="preview"
      ></div>

    </div>

  </div>

</section>


<!-- AUDIO -->
<section id="audioPage" class="page hidden">

  <div class="page-inner">

    <button
      class="back-btn"
      onclick="goMain()"
      data-i18n="back"
    >
      ← BACK
    </button>


    <div class="card">

      <div
        class="card-title"
        data-i18n="audioSystem"
      >
        🎧 Audio System
      </div>


      <div class="switch-row">

        <span data-i18n="onOff">
          ON / OFF
        </span>

        <label class="switch">

          <input
            id="audioEnabled"
            type="checkbox"
          >

          <span class="slider"></span>

        </label>

      </div>


      <div class="field">

        <label data-i18n="audioText">
          Audio Text
        </label>

        <textarea id="audioText"></textarea>

      </div>


      <div class="field">

        <label data-i18n="audioUrl">
          Audio URL
        </label>

        <input
          id="audioUrl"
          type="url"
          data-ph="audioUrlPlaceholder"
        >

      </div>


      <div class="upload-box">

        <label data-i18n="audioUpload">
          Audio Upload
        </label>

        <input
          id="audioFile"
          type="file"
          accept="audio/*"
        >

        <div
          class="media-note"
          data-i18n="max50"
        >
          Maximum 50 MB
        </div>

      </div>


      <div class="hr"></div>


      <div
        class="card-title"
        data-i18n="button1"
      >
        Button 1
      </div>


      <div class="switch-row">

        <span data-i18n="onOff">
          ON / OFF
        </span>

        <label class="switch">

          <input
            id="audioB1Enabled"
            type="checkbox"
          >

          <span class="slider"></span>

        </label>

      </div>


      <div class="field">

        <label data-i18n="buttonText">
          Button Text
        </label>

        <input
          id="audioB1Text"
          type="text"
        >

      </div>


      <div class="field">

        <label data-i18n="buttonUrl">
          Button URL
        </label>

        <input
          id="audioB1Url"
          type="url"
        >

      </div>


      <div class="field">

        <label data-i18n="buttonColor">
          Button Color
        </label>

        <input
          id="audioB1Color"
          type="color"
          value="#6d5dfc"
          style="width:100%;height:48px"
        >

      </div>


      <div
        class="card-title"
        data-i18n="button2"
      >
        Button 2
      </div>


      <div class="switch-row">

        <span data-i18n="onOff">
          ON / OFF
        </span>

        <label class="switch">

          <input
            id="audioB2Enabled"
            type="checkbox"
          >

          <span class="slider"></span>

        </label>

      </div>


      <div class="field">

        <label data-i18n="buttonText">
          Button Text
        </label>

        <input
          id="audioB2Text"
          type="text"
        >

      </div>


      <div class="field">

        <label data-i18n="buttonUrl">
          Button URL
        </label>

        <input
          id="audioB2Url"
          type="url"
        >

      </div>


      <div class="field">

        <label data-i18n="buttonColor">
          Button Color
        </label>

        <input
          id="audioB2Color"
          type="color"
          value="#6d5dfc"
          style="width:100%;height:48px"
        >

      </div>


      <button
        class="save-btn"
        onclick="saveAudio()"
        data-i18n="save"
      >
        💾 SAVE
      </button>


      <div
        id="audioView"
        class="preview"
      ></div>

    </div>

  </div>

</section>


<!-- SYSTEM SETTINGS -->
<section id="systemSettingsPage" class="page hidden">

  <div class="page-inner">

    <button
      class="back-btn"
      onclick="goMain()"
      data-i18n="back"
    >
      ← BACK
    </button>


    <div class="card">

      <div
        class="card-title"
        data-i18n="systemSettings"
      >
        ⚙️ System Settings
      </div>


      <div class="field">

        <label data-i18n="autoDelete">
          Auto Delete
        </label>

        <select id="autoDelete">

          <option
            value="0"
            data-i18n="off"
          >
            OFF
          </option>

          <option
            value="30"
            data-i18n="sec30"
          >
            30 Seconds
          </option>

          <option
            value="60"
            data-i18n="min1"
          >
            1 Minute
          </option>

          <option
            value="120"
            data-i18n="min2"
          >

/* =========================
   TOAST
========================= */

function toast(message){

  const el = $('toast');

  el.textContent = message;

  el.style.display = 'block';

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(() => {

      el.style.display = 'none';

    },2300);

}


/* =========================
   API
========================= */

async function api(url,opt={}){

  opt.headers = {

    ...(opt.headers || {}),

    Authorization:
      token
        ? `Bearer ${token}`
        : ''

  };

  const response =
    await fetch(url,opt);

  if(response.status === 401){

    localStorage.removeItem(
      'admin_token'
    );

    token = '';

    showOnly('loginPage');

    throw new Error(
      t('sessionExpired')
    );

  }

  return response.json();

}


/* =========================
   LOGIN
========================= */

async function login(){

  const password =
    $('loginPassword').value.trim();

  if(!password){

    toast(t('enterPassword'));

    return;

  }

  try{

    const response =
      await fetch(
        '/api/login',
        {
          method:'POST',
          headers:{
            'Content-Type':
              'application/json'
          },
          body:JSON.stringify({
            password
          })
        }
      );

    const data =
      await response.json();

    if(!data.ok){

      toast(
        data.error ||
        t('loginFailed')
      );

      return;

    }

    token = data.token;

    localStorage.setItem(
      'admin_token',
      token
    );

    await loadSettings();

    showOnly('mainPage');

    applyLanguage();

  }catch(error){

    toast(
      error.message ||
      t('loginFailed')
    );

  }

}


/* =========================
   NORMALIZE SETTINGS
========================= */

function normalizeSettings(data){

  const s = data || {};

  if(!s.welcome)
    s.welcome = {};

  const w = s.welcome;

  w.profilePhoto =
    !!w.profilePhoto;

  w.mediaType =
    w.mediaType || 'none';

  w.mediaSource =
    w.mediaSource || 'upload';

  w.mediaId =
    w.mediaId || null;

  w.mediaUrl =
    w.mediaUrl || '';

  w.text =
    w.text || '';


  if(!Array.isArray(s.mainButtons))
    s.mainButtons = [];


  const defaults =
    defaultMainButtons();


  defaults.forEach(def => {

    let existing =
      s.mainButtons.find(
        x => x.id === def.id
      );

    if(!existing){

      s.mainButtons.push(
        structuredClone(def)
      );

    }

  });


  s.mainButtons =
    s.mainButtons.map((b,index) => {

      const def =
        defaults.find(
          x => x.id === b.id
        ) || defaults[index] ||
        defaults[0];

      b.id =
        b.id || def.id;

      b.enabled =
        b.enabled !== false;

      b.text =
        b.text || def.text;

      b.buttonColor =
        b.buttonColor ||
        def.buttonColor ||
        '#6d5dfc';

      b.buttonImageUrl =
        b.buttonImageUrl ||
        '';

      b.buttonStyle =
        b.buttonStyle ||
        def.buttonStyle ||
        'primary';

      b.headerMediaType =
        b.headerMediaType ||
        'none';

      b.headerMediaSource =
        b.headerMediaSource ||
        'upload';

      b.headerMediaId =
        b.headerMediaId ||
        null;

      b.headerMediaUrl =
        b.headerMediaUrl ||
        '';

      b.headerText =
        b.headerText ||
        '';

      if(!Array.isArray(b.slots))
        b.slots = [];

      b.slots =
        b.slots.map(slot => {

          slot.enabled =
            slot.enabled !== false;

          slot.mediaType =
            slot.mediaType || 'none';

          slot.mediaSource =
            slot.mediaSource || 'upload';

          slot.mediaId =
            slot.mediaId || null;

          slot.mediaUrl =
            slot.mediaUrl || '';

          slot.text =
            slot.text || '';

          slot.button1 =
            slot.button1 || {};

          slot.button2 =
            slot.button2 || {};

          slot.button1.enabled =
            slot.button1.enabled !== false;

          slot.button1.text =
            slot.button1.text ||
            t('openLink');

          slot.button1.url =
            slot.button1.url || '';

          slot.button1.color =
            slot.button1.color ||
            '#6d5dfc';

          slot.button2.enabled =
            !!slot.button2.enabled;

          slot.button2.text =
            slot.button2.text ||
            t('support');

          slot.button2.url =
            slot.button2.url || '';

          slot.button2.color =
            slot.button2.color ||
            '#6d5dfc';

          return slot;

        });

      return b;

    });


  if(!s.audio){

    s.audio = {

      enabled:false,

      text:'',

      mediaType:'audio',

      mediaSource:'url',

      mediaId:null,

      mediaUrl:'',

      button1:{
        enabled:false,
        text:'',
        url:'',
        color:'#6d5dfc'
      },

      button2:{
        enabled:false,
        text:'',
        url:'',
        color:'#6d5dfc'
      }

    };

  }


  s.audio.enabled =
    !!s.audio.enabled;

  s.audio.text =
    s.audio.text || '';

  s.audio.mediaType =
    'audio';

  s.audio.mediaSource =
    s.audio.mediaSource ||
    'url';

  s.audio.mediaId =
    s.audio.mediaId || null;

  s.audio.mediaUrl =
    s.audio.mediaUrl || '';


  s.audio.button1 =
    s.audio.button1 || {};

  s.audio.button2 =
    s.audio.button2 || {};


  s.audio.button1.enabled =
    !!s.audio.button1.enabled;

  s.audio.button1.text =
    s.audio.button1.text || '';

  s.audio.button1.url =
    s.audio.button1.url || '';

  s.audio.button1.color =
    s.audio.button1.color ||
    '#6d5dfc';


  s.audio.button2.enabled =
    !!s.audio.button2.enabled;

  s.audio.button2.text =
    s.audio.button2.text || '';

  s.audio.button2.url =
    s.audio.button2.url || '';

  s.audio.button2.color =
    s.audio.button2.color ||
    '#6d5dfc';


  s.autoDelete =
    Number(s.autoDelete || 0);


  return s;

}

/* =========================

========================= */

function renderWelcome(){

  const w =
    settings.welcome || {};

  $('profilePhoto').checked =
    !!w.profilePhoto;

  $('welcomeMediaType').value =
    w.mediaType || 'none';

  $('welcomeMediaSource').value =
    w.mediaSource || 'upload';

  $('welcomeMediaUrl').value =
    w.mediaUrl || '';

  $('welcomeText').value =
    w.text || '';

  renderWelcomeView();

}


async function saveWelcome(){

  const w =
    settings.welcome;

  w.profilePhoto =
    $('profilePhoto').checked;

  w.mediaType =
    $('welcomeMediaType').value;

  w.mediaSource =
    $('welcomeMediaSource').value;

  w.mediaUrl =
    $('welcomeMediaUrl').value.trim();

  w.text =
    $('welcomeText').value;


  const file =
    $('welcomeFile').files[0];


  if(
    w.mediaSource === 'upload' &&
    file
  ){

    const mediaId =
      await uploadFile(
        file,
        w.mediaType
      );

    if(!mediaId)
      return;

    w.mediaId =
      mediaId;

  }

  else if(
    w.mediaSource === 'url'
  ){

    w.mediaId = null;

  }


  if(
    await saveSettings()
  ){

    renderWelcomeView();

    toast(
      t('welcomeSaved')
    );

  }

}


function renderWelcomeView(){

  const w =
    settings.welcome || {};

  let html =

    `<div class="preview-title">
      👁️ ${escapeHtml(
        t('welcomeSettings')
      )}
    </div>`;


  if(
    w.mediaType !== 'none' &&
    (
      w.mediaId ||
      w.mediaUrl
    )
  ){

    html +=
      mediaPreview(
        w.mediaType,
        w.mediaSource,
        w.mediaId,
        w.mediaUrl
      );

  }


  if(w.text){

    html +=
      `<div class="preview-text">
        ${escapeHtml(w.text)}
      </div>`;

  }


  html +=
    fakeButton(
      t('mainButtons'),
      '#6d5dfc',
      ''
    );


  $('welcomeView').innerHTML =
    html;

}

      .files[0];

    button.headerMediaSource ===

    if(

        await uploadFile(
          file,
          slot.mediaType
        );

      if(!mediaId)

        mediaId;

    }

    else if(
      slot &&
      slot.mediaSource ===

    await saveSettings()
  ){

    renderMainSystemView();

    toast(
      t('buttonSaved')
    );

  }

}


/* =========================
   UPLOAD
========================= */

async function uploadFile(
  file,
  kind
){

  if(!file)
    return null;


  if(
    file.size >
    50 * 1024 * 1024
  ){

    toast(
      t('max50')
    );

    return null;

  }


  let mediaKind =
    ['photo','video','audio']
      .includes(kind)
      ? kind
      : (
          file.type.startsWith(
            'image/'
          )
            ? 'photo'
            : file.type.startsWith(
                'video/'
              )
                ? 'video'
                : 'audio'
        );


  const form =
    new FormData();

  form.append(
    'kind',
    mediaKind
  );

  form.append(
    'file',
    file
  );


  toast(
    t('uploading')
  );


  try{

    const response =
      await fetch(
        '/api/upload',
        {
          method:'POST',
          headers:{
            Authorization:
              `Bearer ${token}`
          },
          body:form
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      toast(
        data.error ||
        t('uploadFailed')
      );

      return null;

    }


    toast(
      t('uploadComplete')
    );


    return data.mediaId;

  }catch(error){

    toast(
      error.message ||
      t('uploadFailed')
    );

    return null;

  }

}

/* =========================
   MEDIA PREVIEW
========================= */

function mediaPreview(
  type,
  source,
  id,
  url
){

  const src =
    source === 'upload' &&
    id
      ? `/media/${id}`
      : (
          url || ''
        );


  if(!src){

    return `
      <div class="preview-media">
        ${t('noMedia')}
      </div>
    `;

  }


  if(type === 'photo'){

    return `
      <div class="preview-media">
        <img
          src="${escapeAttr(src)}"
          alt=""
        >
      </div>
    `;

  }


  if(type === 'video'){

    return `
      <div class="preview-media">
        <video
          src="${escapeAttr(src)}"
          controls
          playsinline
        ></video>
      </div>
    `;

  }


  if(type === 'audio'){

    return `
      <div style="margin-bottom:10px">
        <audio
          src="${escapeAttr(src)}"
          controls
          style="width:100%"
        ></audio>
      </div>
    `;

  }


  return '';

}

      .contains('hidden')
  ){

    renderAudio();

  }

  else if(
    !$('systemSettingsPage')
      .classList
      .contains('hidden')
  ){

    renderSystemSettings();

  }

  else if(
    !$('allViewPage')
      .classList
      .contains('hidden')
  ){

    renderAllView();

  }

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  return String(
    value ?? ''
  )
  .replaceAll(
    '&',
    '&amp;'
  )
  .replaceAll(
    '<',
    '&lt;'
  )
  .replaceAll(
    '>',
    '&gt;'
  )
  .replaceAll(
    '"',
    '&quot;'
  )
  .replaceAll(
    "'",
    '&#039;'
  );

}


function escapeAttr(value){

  return escapeHtml(
    value
  );

}


/* =========================
   LIVE MAIN EDITOR
========================= */

[
  'mainEnabled',
  'mainButtonText',
  'mainButtonColor',
  'mainButtonImage',
  'headerMediaType',
  'headerMediaSource',
  'headerMediaUrl',
  'headerText'
]
.forEach(id => {

  const element =
    $(id);

  if(!element)
    return;


  element.addEventListener(
    'input',
    () => {

      syncMainEditor();

      renderMainSystemView();

      const button =
        getCurrentButton();

      if(button){

        $('mainEditorTitle')
          .textContent =
            button.text ||
            'Main Button';

      }

    }
  );


  element.addEventListener(
    'change',
    () => {

      syncMainEditor();

      renderMainSystemView();

    }
  );

});


/* =========================
   THEME RESTORE
========================= */

(function(){

  if(
    localStorage.getItem(
      'admin_theme'
    ) === 'dark'
  ){

    document.body
      .classList
      .add('dark');

  }


  applyLanguage();

})();


/* =========================
   BOOT
========================= */

async function boot(){

  if(!token){

    showOnly(
      'loginPage'
    );

    applyLanguage();

    return;

  }


  try{

    await loadSettings();

    showOnly(
      'mainPage'
    );

    applyLanguage();

  }catch(error){

    localStorage.removeItem(
      'admin_token'
    );

    token = '';

    showOnly(
      'loginPage'
    );

    applyLanguage();

  }

}


boot();

</script>
