<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Telegram Admin Panel</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#f4f5f8;
 color:#171923;
 font-family:Arial,sans-serif;
 transition:.25s;
}

body.dark{
 background:#101114;
 color:#f5f5f5;
}

.app{
 width:100%;
 max-width:540px;
 margin:auto;
 padding:14px;
}

.card{
 background:#fff;
 border-radius:18px;
 padding:16px;
 margin-bottom:12px;
 box-shadow:0 7px 24px rgba(0,0,0,.07);
}

.dark .card{
 background:#1b1d22;
}

h1{
 font-size:21px;
 margin:0;
}

h2{
 font-size:18px;
 margin:0 0 14px;
}

h3{
 font-size:15px;
 margin:0 0 10px;
}

.small{
 font-size:12px;
 color:#777;
}

.dark .small{
 color:#aaa;
}

input,
select,
textarea{
 width:100%;
 padding:11px;
 border:1px solid #ddd;
 border-radius:10px;
 background:#fafafa;
 color:#111;
 margin-bottom:8px;
}

.dark input,
.dark select,
.dark textarea{
 background:#25272d;
 color:#fff;
 border-color:#444;
}

textarea{
 min-height:85px;
 resize:vertical;
}

label{
 display:block;
 font-weight:bold;
 font-size:13px;
 margin:9px 0 5px;
}

button{
 font-family:inherit;
}

.btn{
 width:100%;
 padding:11px;
 border:0;
 border-radius:10px;
 margin-top:7px;
 cursor:pointer;
 font-weight:bold;
}

.primary{
 background:#6842ee;
 color:white;
}

.secondary{
 background:#eceef3;
 color:#222;
}

.dark .secondary{
 background:#303239;
 color:#fff;
}

.danger{
 background:#ffe8e6;
 color:#c62b21;
}

.row{
 display:flex;
 gap:8px;
}

.row>*{
 flex:1;
}

.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:12px;
}

.topActions{
 display:flex;
 gap:6px;
}

.iconBtn{
 width:40px;
 height:40px;
 border:0;
 border-radius:12px;
 background:#fff;
 cursor:pointer;
 font-size:18px;
}

.dark .iconBtn{
 background:#25272d;
 color:#fff;
}

.login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
}

.loginBox{
 width:100%;
 max-width:400px;
}

.hidden{
 display:none!important;
}

.menuBtn{
 width:100%;
 border:1px solid #e1e2e8;
 background:#fff;
 color:#171923;
 border-radius:13px;
 padding:14px;
 text-align:left;
 margin-bottom:8px;
 cursor:pointer;
 font-weight:bold;
}

.dark .menuBtn{
 background:#1b1d22;
 color:#fff;
 border-color:#34363d;
}

.backBtn{
 margin-bottom:10px;
}

.slot{
 border:1px solid #e0e2e8;
 border-radius:14px;
 padding:13px;
 margin-top:11px;
 background:#fafbfc;
}

.dark .slot{
 background:#22242a;
 border-color:#383a42;
}

.slotTitle{
 font-weight:bold;
 margin-bottom:8px;
}

.switch{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:7px 0;
}

.switch input{
 width:auto;
 margin:0;
 transform:scale(1.2);
}

.preview{
 background:#e9ebf0;
 padding:14px;
 border-radius:16px;
}

.dark .preview{
 background:#0d0e10;
}

.previewPhone{
 background:#fff;
 border-radius:15px;
 overflow:hidden;
}

.dark .previewPhone{
 background:#191a1e;
}

.previewMedia{
 width:100%;
 aspect-ratio:2/1;
 object-fit:cover;
 background:#d8d9df;
 display:flex;
 align-items:center;
 justify-content:center;
}

.previewText{
 padding:12px;
 white-space:pre-wrap;
}

.previewButton{
 margin:6px 10px;
 border-radius:10px;
 padding:11px;
 text-align:center;
 color:#fff;
 font-weight:bold;
}

.code{
 background:#eee9ff;
 border-radius:10px;
 padding:12px;
 text-align:center;
 font-size:18px;
 font-weight:bold;
 margin-top:8px;
}

.status{
 padding:9px;
 background:#f0f1f4;
 border-radius:9px;
 font-size:12px;
 margin-top:7px;
}

.dark .status{
 background:#282a30;
}

.fileBox{
 border:1px dashed #bbb;
 padding:10px;
 border-radius:10px;
 margin-top:7px;
}

hr{
 border:0;
 border-top:1px solid #e5e5e5;
 margin:16px 0;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login" class="login">

 <div class="loginBox card">

  <h1>🤖 Telegram Bot</h1>

  <div class="small">
   Admin Panel
  </div>

  <label>Admin Password</label>

  <input
   id="password"
   type="password"
   placeholder="Enter password">

  <button
   class="btn primary"
   onclick="login()">
   LOGIN
  </button>

  <div
   id="loginError"
   class="status hidden">
  </div>

 </div>

</div>


<!-- ADMIN -->

<div
 id="admin"
 class="app hidden">

 <div class="top">

  <div>
   <h1>Admin Panel</h1>
   <div
    id="langTitle"
    class="small">
    Telegram Bot Control
   </div>
  </div>

  <div class="topActions">

   <button
    class="iconBtn"
    onclick="toggleDark()">
    🌞
   </button>

   <button
    class="iconBtn"
    onclick="toggleLang()">
    🇧🇩
   </button>

  </div>

 </div>


 <!-- MAIN ADMIN PAGE -->

 <div id="homePage">

  <div class="card">

   <h2>👋 Welcome Settings</h2>

   <button
    class="menuBtn"
    onclick="openPage('welcome')">
    👋 Welcome Settings
   </button>

  </div>


  <div class="card">

   <h2>🏠 Main Buttons</h2>

   <div
    id="mainMenuButtons">
   </div>

  </div>


  <div class="card">

   <button
    class="menuBtn"
    onclick="openPage('audio')">
    🎧 Audio System
   </button>

   <button
    class="menuBtn"
    onclick="openPage('system')">
    ⚙️ System Settings
   </button>

   <button
    class="menuBtn"
    onclick="openPage('allPreview')">
    👁️ ALL SYSTEM VIEW
   </button>

   <button
    class="btn danger"
    onclick="resetSystem()">
    ALL WELCOME SYSTEM RESET
   </button>

  </div>

 </div>


 <!-- WELCOME PAGE -->

 <div
  id="welcomePage"
  class="hidden">

  <button
   class="btn secondary backBtn"
   onclick="home()">
   ← BACK
  </button>

  <div class="card">

   <h2>👋 Welcome Settings</h2>

   <div class="switch">
    <span>Welcome ON/OFF</span>
    <input
     id="welcomeEnabled"
     type="checkbox">
   </div>

   <div class="switch">
    <span>Profile Photo</span>
    <input
     id="profilePhoto"
     type="checkbox">
   </div>

   <label>Welcome Text</label>

   <textarea
    id="welcomeText"></textarea>

   <label>Text Size</label>

   <select id="welcomeSize">
    <option value="small">Small</option>
    <option value="medium">Medium</option>
    <option value="large">Large</option>
   </select>

   <label>Media Type</label>

   <select
    id="welcomeType"
    onchange="mediaMode('welcome')">
    <option value="none">None</option>
    <option value="photo">Image</option>
    <option value="video">Video</option>
    <option value="audio">Audio</option>
   </select>

   <div
    id="welcomeMediaBox"
    class="fileBox">
   </div>

   <label>Button Background Color</label>

   <input
    id="welcomeBg"
    type="color">

   <label>Button Text Color</label>

   <input
    id="welcomeColor"
    type="color">

   <button
    class="btn primary"
    onclick="save()">
    SAVE WELCOME
   </button>

   <button
    class="btn secondary"
    onclick="openPage('allPreview')">
    👁️ SYSTEM VIEW
   </button>

  </div>

 </div>


 <!-- SECTION PAGE -->

 <div
  id="sectionPage"
  class="hidden">

  <button
   class="btn secondary backBtn"
   onclick="home()">
   ← BACK
  </button>

  <div class="card">

   <h2 id="sectionTitle">
   </h2>

   <div class="switch">
    <span>ON / OFF</span>
    <input
     id="sectionEnabled"
     type="checkbox">
   </div>

   <label>Button Name</label>

   <input
    id="sectionButtonName">

   <label>Top Text Message</label>

   <textarea
    id="sectionText"></textarea>

   <label>Top Media Type</label>

   <select
    id="sectionType"
    onchange="mediaMode('section')">
    <option value="none">None</option>
    <option value="photo">Image</option>
    <option value="video">Video</option>
    <option value="audio">Audio</option>
   </select>

   <div
    id="sectionMediaBox"
    class="fileBox">
   </div>

   <label>Button Background Color</label>

   <input
    id="sectionBg"
    type="color">

   <label>Button Text Color</label>

   <input
    id="sectionColor"
    type="color">

  </div>


  <div class="card">

   <h2>📦 Content Slots</h2>

   <div
    id="slots">
   </div>

   <button
    class="btn secondary"
    onclick="addSlot()">
    + ADD SLOT
   </button>

   <button
    class="btn primary"
    onclick="save()">
    SAVE
   </button>

  </div>


  <div class="card">

   <h2>👁️ System View</h2>

   <div
    id="sectionPreview">
   </div>

  </div>

 </div>


 <!-- AUDIO PAGE -->

 <div
  id="audioPage"
  class="hidden">

  <button
   class="btn secondary backBtn"
   onclick="home()">
   ← BACK
  </button>

  <div class="card">

   <h2>🎧 Audio System</h2>

   <div class="switch">
    <span>ON / OFF</span>
    <input
     id="audioEnabled"
     type="checkbox">
   </div>

   <label>Audio Text</label>

   <textarea
    id="audioText"></textarea>

   <label>Audio URL</label>

   <input
    id="audioUrl"
    placeholder="https://example.com/audio.mp3">

   <div class="fileBox">

    <label>Audio Upload</label>

    <input
     id="audioFile"
     type="file"
     accept="audio/*">

    <button
     class="btn secondary"
     onclick="uploadAudio()">
     UPLOAD AUDIO
    </button>

    <div
     id="audioUploadStatus"
     class="small">
    </div>

   </div>

   <hr>

   <h3>Audio Buttons</h3>

   <div id="audioButtons"></div>

   <button
    class="btn primary"
    onclick="save()">
    SAVE AUDIO
   </button>

  </div>

 </div>


 <!-- SYSTEM -->

 <div
  id="systemPage"
  class="hidden">

  <button
   class="btn secondary backBtn"
   onclick="home()">
   ← BACK
  </button>

  <div class="card">

   <h2>⚙️ System Settings</h2>

   <label>Auto Delete</label>

   <select id="autoDelete">
    <option value="0">OFF</option>
    <option value="30">30 Seconds</option>
    <option value="60">1 Minute</option>
    <option value="120">2 Minutes</option>
    <option value="300">5 Minutes</option>
    <option value="600">10 Minutes</option>
    <option value="900">15 Minutes</option>
   </select>

   <button
    class="btn primary"
    onclick="save()">
    SAVE SYSTEM
   </button>

   <hr>

   <button
    class="btn danger"
    onclick="resetSystem()">
    RESET EVERYTHING
   </button>

  </div>

 </div>


 <!-- ALL PREVIEW -->

 <div
  id="allPreviewPage"
  class="hidden">

  <button
   class="btn secondary backBtn"
   onclick="home()">
   ← BACK
  </button>

  <div class="card">

   <h2>👁️ ALL SYSTEM VIEW</h2>

   <div
    id="allPreview">
   </div>

   <button
    class="btn primary"
    onclick="save()">
    ALL WELCOME SYSTEM SAVE
   </button>

  </div>

 </div>

</div>


<script>

let pass="";
let data=null;
let currentSection="";


/* =========================================================
   LOGIN
========================================================= */

function login(){

 const p=
  document.getElementById(
   "password"
  ).value.trim();

 fetch(
  "/api/login",
  {
   method:"POST",
   headers:{
    "Content-Type":
     "application/json"
   },
   body:JSON.stringify({
    password:p
   })
  }
 )
 .then(async r=>{
  const x=await r.json();

  if(!r.ok)
   throw new Error(
    x.error
   );

  pass=p;

  sessionStorage.setItem(
   "botAdminPassword",
   pass
  );

  document
   .getElementById("login")
   .classList.add("hidden");

  document
   .getElementById("admin")
   .classList.remove("hidden");

  load();
 })
 .catch(e=>{
  const x=
   document.getElementById(
    "loginError"
   );

  x.textContent=e.message;
  x.classList.remove(
   "hidden"
  );
 });
}


/* =========================================================
   API
========================================================= */

function headers(){
 return {
  "Content-Type":
   "application/json",
  "x-admin-password":pass
 };
}

function load(){

 fetch(
  "/api/settings",
  {
   headers:headers()
  }
 )
 .then(r=>r.json())
 .then(x=>{
  data=x.settings;
  render();
 });
}


/* =========================================================
   HOME
========================================================= */

function home(){

 document
  .querySelectorAll(
   "#admin>div:not(.top)"
  )
  .forEach(x=>{
   x.classList.add(
    "hidden"
   );
  });

 document
  .getElementById(
   "homePage"
  )
  .classList.remove(
   "hidden"
  );

 renderMainButtons();
}


function openPage(name){

 home();

 document
  .getElementById(
   name+"Page"
  )
  .classList.remove(
   "hidden"
  );

 if(name==="welcome")
  renderWelcome();

 if(name==="audio")
  renderAudio();

 if(name==="system")
  renderSystem();

 if(name==="allPreview")
  renderAllPreview();
}


/* =========================================================
   MAIN BUTTONS
========================================================= */

function renderMainButtons(){

 const box=
  document.getElementById(
   "mainMenuButtons"
  );

 box.innerHTML="";

 data.mainButtons
  .forEach((b,i)=>{

   const x=
    document.createElement(
     "button"
    );

   x.className=
    "menuBtn";

   x.innerHTML=
    `${b.enabled?"🟢":"🔴"}
     ${escapeHtml(b.text)}`;

   x.onclick=()=>{
    openSection(
     b.section
    );
   };

   box.appendChild(x);
  });
}


/* =========================================================
   SECTION
========================================================= */

function openSection(name){

 currentSection=name;

 home();

 document
  .getElementById(
   "sectionPage"
  )
  .classList.remove(
   "hidden"
  );

 renderSection();
}


function renderSection(){

 const s=
  data.sections[
   currentSection
  ];

 const mainIndex=
  data.mainButtons.findIndex(
   x=>
    x.section===
    currentSection
  );

 document.getElementById(
  "sectionTitle"
 ).textContent=
  data.mainButtons[
   mainIndex
  ]?.text ||
  s.title;

 document.getElementById(
  "sectionEnabled"
 ).checked=
  s.enabled;

 document.getElementById(
  "sectionButtonName"
 ).value=
  s.title || "";

 document.getElementById(
  "sectionText"
 ).value=
  s.text || "";

 document.getElementById(
  "sectionType"
 ).value=
  s.mediaType || "none";

 document.getElementById(
  "sectionBg"
 ).value=
  s.buttonBg ||
  "#6842ee";

 document.getElementById(
  "sectionColor"
 ).value=
  s.buttonTextColor ||
  "#ffffff";

 renderMediaBox(
  "section",
  s
 );

 renderSlots();

 renderSectionPreview();
}


/* =========================================================
   SLOT
========================================================= */

function renderSlots(){

 const box=
  document.getElementById(
   "slots"
  );

 box.innerHTML="";

 const list=
  data.sections[
   currentSection
  ].slots || [];

 list.forEach(
  (s,i)=>{

   const d=
    document.createElement(
     "div"
    );

   d.className="slot";

   d.innerHTML=`

    <div class="slotTitle">
     Slot ${i+1}
    </div>

    <div class="switch">
     <span>ON / OFF</span>
     <input
      type="checkbox"
      data-slot-enabled="${i}"
      ${s.enabled!==false?"checked":""}>
    </div>

    <label>Media Type</label>

    <select
     data-slot-type="${i}"
     onchange="renderSlotMedia(${i})">

     <option value="none">
      None
     </option>

     <option value="photo">
      Image
     </option>

     <option value="video">
      Video
     </option>

     <option value="audio">
      Audio
     </option>

    </select>

    <div
     id="slotMedia${i}">
    </div>

    <label>Text Message</label>

    <textarea
     data-slot-text="${i}">
${escapeHtml(s.text||"")}</textarea>

    <hr>

    <b>Button 1</b>

    <div class="switch">
     <span>ON / OFF</span>
     <input
      type="checkbox"
      data-slot-b1-enabled="${i}"
      ${s.buttons?.[0]?.enabled?"checked":""}>
    </div>

    <input
     data-slot-b1-text="${i}"
     placeholder="Button Text"
     value="${escapeAttr(
      s.buttons?.[0]?.text||""
     )}">

    <input
     data-slot-b1-url="${i}"
     placeholder="Button URL"
     value="${escapeAttr(
      s.buttons?.[0]?.url||""
     )}">

    <b>Button 2</b>

    <div class="switch">
     <span>ON / OFF</span>
     <input
      type="checkbox"
      data-slot-b2-enabled="${i}"
      ${s.buttons?.[1]?.enabled?"checked":""}>
    </div>

    <input
     data-slot-b2-text="${i}"
     placeholder="Button Text"
     value="${escapeAttr(
      s.buttons?.[1]?.text||""
     )}">

    <input
     data-slot-b2-url="${i}"
     placeholder="Button URL"
     value="${escapeAttr(
      s.buttons?.[1]?.url||""
     )}">

    <button
     class="btn danger"
     onclick="removeSlot(${i})">
     REMOVE SLOT
    </button>
   `;

   box.appendChild(d);

   d.querySelector(
    `[data-slot-type="${i}"]`
   ).value=
    s.mediaType||"none";

   renderSlotMedia(i);
  });
}


function renderSlotMedia(i){

 const s=
  data.sections[
   currentSection
  ].slots[i];

 const box=
  document.getElementById(
   "slotMedia"+i
  );

 if(!box)return;

 box.innerHTML="";

 if(
  !s ||
  s.mediaType==="none"
 ){
  return;
 }

 box.innerHTML=`

  <label>Media Source</label>

  <select
   data-slot-source="${i}"
   onchange="renderSlotMedia(${i})">

   <option
    value="upload"
    ${s.mediaSource==="upload"?"selected":""}>
    Upload
   </option>

   <option
    value="url"
    ${s.mediaSource==="url"?"selected":""}>
    URL Link
   </option>

  </select>
 `;

 const source=
  box.querySelector(
   `[data-slot-source="${i}"]`
  ).value;

 if(source==="url"){

  box.innerHTML+=`

   <input
    data-slot-url="${i}"
    placeholder="Direct media URL"
    value="${escapeAttr(
     s.mediaUrl||""
    )}">

  `;

 }else{

  box.innerHTML+=`

   <input
    type="file"
    id="slotFile${i}">

   <button
    class="btn secondary"
    onclick="uploadSlot(${i})">
    UPLOAD
   </button>

   <div
    id="slotStatus${i}"
    class="small">
   </div>

  `;
 }
}


function addSlot(){

 const s=
  data.sections[
   currentSection
  ];

 s.slots.push({
  enabled:true,
  mediaType:"none",
  mediaSource:"upload",
  mediaId:null,
  mediaUrl:"",
  text:"",
  buttons:[
   {
    enabled:true,
    text:"OPEN",
    url:""
   },
   {
    enabled:true,
    text:"💬 SUPPORT",
    url:""
   }
  ]
 });

 renderSlots();
}


function removeSlot(i){

 data.sections[
  currentSection
 ].slots.splice(i,1);

 renderSlots();
}


/* =========================================================
   WELCOME
========================================================= */

function renderWelcome(){

 const w=data.welcome;

 document.getElementById(
  "welcomeEnabled"
 ).checked=w.enabled;

 document.getElementById(
  "profilePhoto"
 ).checked=w.profilePhoto;

 document.getElementById(
  "welcomeText"
 ).value=w.text||"";

 document.getElementById(
  "welcomeSize"
 ).value=
  w.textSize||"medium";

 document.getElementById(
  "welcomeType"
 ).value=
  w.mediaType||"none";

 document.getElementById(
  "welcomeBg"
 ).value=
  w.buttonBg||"#6842ee";

 document.getElementById(
  "welcomeColor"
 ).value=
  w.buttonTextColor||"#ffffff";

 renderMediaBox(
  "welcome",
  w
 );
}


/* =========================================================
   MEDIA BOX
========================================================= */

function renderMediaBox(
 type,
 obj
){

 const box=
  document.getElementById(
   type==="welcome"
    ? "welcomeMediaBox"
    : "sectionMediaBox"
  );

 const select=
  document.getElementById(
   type==="welcome"
    ? "welcomeType"
    : "sectionType"
  );

 box.innerHTML="";

 if(
  select.value==="none"
 ){
  return;
 }

 box.innerHTML=`

  <label>Media Source</label>

  <select
   id="${type}Source"
   onchange="renderMediaBox('${type}',data.${type==='welcome'?'welcome':'sections[currentSection]'})">

   <option
    value="upload"
    ${obj.mediaSource==="upload"?"selected":""}>
    Upload
   </option>

   <option
    value="url"
    ${obj.mediaSource==="url"?"selected":""}>
    URL Link
   </option>

  </select>
 `;

 if(
  obj.mediaSource==="url"
 ){

  box.innerHTML+=`

   <input
    id="${type}Url"
    placeholder="Direct media URL"
    value="${escapeAttr(
     obj.mediaUrl||""
    )}">

  `;

 }else{

  box.innerHTML+=`

   <input
    id="${type}File"
    type="file">

   <button
    class="btn secondary"
    onclick="uploadGeneral('${type}')">
    UPLOAD MEDIA
   </button>

   <div
    id="${type}Status"
    class="small">
   </div>

  `;
 }
}


/* =========================================================
   AUDIO
========================================================= */

function renderAudio(){

 const a=data.audio;

 document.getElementById(
  "audioEnabled"
 ).checked=a.enabled;

async function uploadFile(
 file,
 kind
){

 const fd=
  new FormData();

 fd.append(
  "file",
  file
 );

 fd.append(
  "kind",
  kind
 );

 const r=
  await fetch(
   "/api/upload",
   {
    method:"POST",
    headers:{
     "x-admin-password":
      pass
    },
    body:fd
   }
  );

 const x=
  await r.json();

 if(!r.ok)
  throw new Error(
   x.error
  );

 return x.id;
}

/* =========================================================
   PREVIEW
========================================================= */

function mediaPreview(
 obj
){

 if(
  !obj ||
  obj.mediaType==="none"
 ){
  return "";
 }

 if(
  obj.mediaSource==="url" &&
  obj.mediaUrl
 ){

  if(
   obj.mediaType==="photo"
  ){
   return `
    <img
     class="previewMedia"
     src="${escapeAttr(
      obj.mediaUrl
     )}">
   `;
  }

  if(
   obj.mediaType==="video"
  ){
   return `
    <video
     class="previewMedia"
     controls
     src="${escapeAttr(
      obj.mediaUrl
     )}">
    </video>
   `;
  }

  return `
   <div class="previewMedia">
    🎧 AUDIO
   </div>
  `;
 }

 return `
  <div class="previewMedia">
   ${obj.mediaType==="video"
    ?"🎬 VIDEO"
    :obj.mediaType==="audio"
    ?"🎧 AUDIO"
    :"🖼️ IMAGE"}
  </div>
 `;
}


function renderSectionPreview(){

 const s=
  data.sections[
   currentSection
  ];

 let html="";

 html+=mediaPreview(s);

 if(s.text){
  html+=`
   <div class="previewText">
    ${escapeHtml(
     s.text
    )}
   </div>
  `;
 }

 (s.slots||[]).forEach(
  x=>{

   if(x.enabled===false)
    return;

   html+=`
    <div class="slot">
     ${mediaPreview(x)}
     <div class="previewText">
      ${escapeHtml(
       x.text||""
      )}
     </div>
    `;

   (x.buttons||[])
    .forEach(b=>{

     if(
      !b.enabled ||
      !b.text
     )return;

     html+=`
      <div
       class="previewButton"
       style="
       background:${s.buttonBg};
       color:${s.buttonTextColor}">
       ${escapeHtml(
        b.text
       )}
      </div>
     `;
    });

   html+=`
    </div>
   `;
  }
 );

 document.getElementById(
  "sectionPreview"
 ).innerHTML=
  `<div class="preview">
   <div class="previewPhone">
    ${html}
   </div>
  </div>`;
}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(x){

 return String(
  x||""
 )
 .replace(
  /&/g,
  "&amp;"
 )
 .replace(
  /</g,
  "&lt;"
 )
 .replace(
  />/g,
  "&gt;"
 );
}

function escapeAttr(x){

 return escapeHtml(x)
  .replace(
   /"/g,
   "&quot;"
  );
}
